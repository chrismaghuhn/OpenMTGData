[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmtgdata"
dynamic = ["version"]
description = "Model-independent infrastructure for reproducible MTG datasets"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
openmtgdata = "openmtgdata.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openmtgdata.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/openmtgdata"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
